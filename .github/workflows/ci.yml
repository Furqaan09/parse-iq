name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ----- Backend -----
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: parseiq
          POSTGRES_PASSWORD: parseiq_pw
          POSTGRES_DB: parseiq_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U parseiq"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://parseiq:parseiq_pw@localhost:5432/parseiq_test

    steps:
      - uses: actions/checkout@v4

      # Installs uv
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: api/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run black --check .

      - name: Apply migrations
        run: uv run alembic upgrade head

      # Fails if models.py changed without a matching migration
      - name: Check models match migrations
        run: uv run alembic check

      - name: Cache reranker model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-${{ hashFiles('api/app/retrieval/rerank.py') }}

      - name: Run tests
        run: uv run pytest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RAG_EVAL_REPORT_DIR: ${{ github.workspace }}/eval-reports
          FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

      - name: Post retrieval eval report to the run summary
        if: always()
        run: cat "$GITHUB_WORKSPACE/eval-reports/retrieval.md" >> "$GITHUB_STEP_SUMMARY" || echo "No report generated"

  # ----- Frontend -----
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  # ---- Deploy -----
  deploy:
    # Only after both jobs passed and only on main branch pushes
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # request an OIDC token from GitHub
      contents: read
    env:
      IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/parseiq:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/parseiq-github-deploy
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push the image
        run: |
          docker build --provenance=false -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Point the Lambda function at the new image
        run: |
          aws lambda update-function-code --function-name parseiq --image-uri "$IMAGE"
          aws lambda wait function-updated-v2 --function-name parseiq

