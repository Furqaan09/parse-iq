name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    backend:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: api

        services:
            postgres:
                image: postgres:16-alpine
                env:
                    POSTGRES_USER: parseiq
                    POSTGRES_PASSWORD: parseiq_pw
                    POSTGRES_DB: parseiq_test
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U parseiq"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10

        env:
            DB_HOST: localhost
            DB_PORT: "5432"
            DB_USER: parseiq
            DB_PASSWORD: parseiq_pw
            DB_NAME: parseiq_test
            HF_TOKEN: test-token-never-used

        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5
              with:
                  python-version: "3.13"
                  cache: pip
                  cache-dependency-path: api/requirements*.txt

            - name: Install CPU-only torch
              run: pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu

            - name: Install dependencies
              run: pip install -r requirements-dev.txt

            - name: Lint
              run: |
                  ruff check app tests
                  black --check app tests

            # Runs the real migrations, so a broken migration fails CI too
            - name: Apply migrations
              run: alembic upgrade head

            # Cache Hugging Face models to avoid downloading every time
            - name: Cache Hugging Face models
              uses: actions/cache@v4
              with:
                  path: ~/.cache/huggingface
                  key: hf-${{ hashFiles('api/app/services/embeddings.py', 'api/app/services/reranker.py') }}

            - name: Run tests
              run: pytest
              env:
                RAG_EVAL_REPORT_DIR: ${{ github.workspace }}/eval-reports

            - name: Post retrieval eval report to the run summary
              if: always()
              run: cat "$GITHUB_WORKSPACE/eval-reports/retrieval.md" >> "$GITHUB_STEP_SUMMARY" || echo "No report generated"
