server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Same job as vite.config.ts's dev proxy: forward /api/* to the backend
    # container, stripping the /api prefix.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /files/ {
        proxy_pass http://api:8000/files/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA fallback: unmatched paths serve index.html so client-side routing
    # doesn't 404 on a page refresh.
    location / {
        try_files $uri /index.html;
    }
}
