# --- UV ---
[project]
name = "parseiq-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.5",
    "fastapi>=0.116.2",
    "fastembed>=0.9.1",
    "huggingface-hub>=0.35.3",
    "openai>=3.48.0",
    "pgvector>=0.5.1",
    "pillow>=11.3.0",
    "psycopg[binary]>=3.2.10",
    "pydantic>=2.11.9",
    "pydantic-settings>=2.16.2",
    "pypdf>=6.21.1",
    "pytesseract>=0.3.13",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.43",
    "sqlmodel>=0.0.25",
    "uvicorn[standard]>=0.35.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.15.20",
]


# --- Black ---
[tool.black]
line-length = 100
target-version = ["py313"]
# Alembic revision files are historical artifacts
extend-exclude = "migration/versions"


# --- Ruff ---
[tool.ruff]
line-length = 100
target-version = "py313"
# Alembic-generated revision files are historical artifacts; don't reformat them.
exclude = ["migration/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",
    # str+Enum is intentional here for JSON/DB-friendly serialization; StrEnum is equivalent noise.
    "UP042",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom (Depends/Body/Query/File in defaults) is
# intentional, not a mutable-default bug.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Body", "fastapi.Query", "fastapi.File", "fastapi.Path"]


# --- Pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs Postgres and OPENAI_API_KEY; downloads the reranker model",
    "eval: scores retrieval/answer quality against the golden set in rag_eval/",
    "llm: calls the real hosted LLM (costs money, needs HF_TOKEN); skipped by default",
]
# Never call the paid LLM unless asked for explicitly with `pytest -m llm`.
addopts = "-m 'not llm'"
